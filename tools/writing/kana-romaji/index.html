<body>

<div class="wrap">
  <section class="view">
    <div class="tool-header">
      <a class="back" href="/">← 道具帖トップ</a>
      <p class="category">文章づくり道具帖</p>
      <h2>かな⇔ローマ字変換</h2>
      <p class="desc">ひらがな・カタカナをヘボン式ローマ字に、またはローマ字をひらがなに変換します（漢字はそのまま出力されます）。</p>
    </div>
    <div class="panel">
      <div class="tool-body stack">
        <div class="toolbar-group">
          <button class="seg active" id="kn-mode-toRomaji">かな → ローマ字</button>
          <button class="seg" id="kn-mode-toKana">ローマ字 → かな</button>
        </div>
        <textarea id="kn-input" aria-label="かな⇔ローマ字変換する文章の入力欄" style="min-height:140px;" placeholder="変換したい文章を入力してください…"></textarea>
        <div class="toolbar-group">
          <button class="primary" id="kn-convert">変換する</button>
          <button class="ghost" id="kn-copy">結果をコピー</button>
          <button class="ghost" id="kn-reset">リセット</button>
        </div>
        <textarea id="kn-output" class="mono" aria-label="かな⇔ローマ字変換結果の出力欄" style="min-height:140px;" placeholder="変換結果がここに表示されます" readonly></textarea>
        <div class="hint" id="kn-hint">拗音・促音・長音（ー）に対応した簡易変換です。</div>
      </div>
    </div>
  </section>
</div>

<footer class="site-footer">
  <p>入力内容はすべてブラウザ内で処理され、外部には送信されません。</p>
  <p>水瀬衡が、文章や経済を書くときに使う小さな『ものさし』をもとにつくっています。</p>
</footer>
<div class="toast" id="toast"></div>

<script src="/assets/common.js"></script>
<script>
(function(){
  "use strict";
  const { copyText } = window.Toolbox;

  /* ===================== かな⇔ローマ字 ===================== */
  const YOUON = {
    'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho',
    'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo',
    'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo',
    'りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
    'じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo',
    'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo'
  };
  const SINGLE = {
    'あ':'a','い':'i','う':'u','え':'e','お':'o',
    'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
    'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
    'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
    'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
    'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
    'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
    'や':'ya','ゆ':'yu','よ':'yo',
    'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
    'わ':'wa','を':'o','ん':'n',
    'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
    'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
    'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do',
    'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
    'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
    'ゃ':'ya','ゅ':'yu','ょ':'yo',
    '。':'。','、':'、','「':'「','」':'」','・':'・'
  };
  const VOWELS = new Set(['a','i','u','e','o']);

  function kanaToRomaji(text){
    const normalized = text.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    let out = '';
    const chars = Array.from(normalized);
    for (let i = 0; i < chars.length; i++){
      const c = chars[i];
      const two = chars[i] + (chars[i+1] || '');
      if (c === 'ー'){
        const last = out.slice(-1);
        out += VOWELS.has(last) ? last : '';
        continue;
      }
      if (c === 'っ'){
        const nextRomaji = YOUON[two.length===2?chars[i+1]+chars[i+2]:''] || SINGLE[chars[i+1]] || '';
        if (/^[a-z]/.test(nextRomaji)) out += nextRomaji.startsWith('ch') ? 't' : nextRomaji[0];
        continue;
      }
      if (YOUON[two]){ out += YOUON[two]; i++; continue; }
      if (SINGLE[c] !== undefined){ out += SINGLE[c]; continue; }
      out += c;
    }
    return out;
  }

  let ROMAJI_TO_KANA = null;
  function buildReverseMap(){
    if (ROMAJI_TO_KANA) return ROMAJI_TO_KANA;
    const rev = {};
    for (const [kana, romaji] of Object.entries(SINGLE)) if (/^[a-z]+$/.test(romaji) && !(romaji in rev)) rev[romaji] = kana;
    for (const [kana, romaji] of Object.entries(YOUON)) if (!(romaji in rev)) rev[romaji] = kana;
    rev['wo'] = 'を'; rev['di'] = 'ぢ'; rev['du'] = 'づ';
    rev['si'] = 'し'; rev['ti'] = 'ち'; rev['tu'] = 'つ'; rev['hu'] = 'ふ'; rev['zi'] = 'じ';
    ROMAJI_TO_KANA = rev;
    return rev;
  }
  function romajiToKana(text){
    const rev = buildReverseMap();
    const maxLen = Math.max(...Object.keys(rev).map(k => k.length));
    const lower = text.toLowerCase();
    const n = lower.length;
    const consonants = new Set(['b','c','d','f','g','h','j','k','m','p','r','s','t','w','y','z']);
    let out = '', i = 0;
    while (i < n){
      if (lower[i] === 'n' && lower[i+1] === "'"){ out += 'ん'; i += 2; continue; }
      if (consonants.has(lower[i]) && lower[i] === lower[i+1]){ out += 'っ'; i += 1; continue; }
      if (lower[i] === 't' && lower.slice(i+1, i+3) === 'ch'){ out += 'っ'; i += 1; continue; }
      let matched = false;
      for (let len = Math.min(maxLen, n-i); len >= 1; len--){
        const sub = lower.slice(i, i+len);
        if (rev[sub]){ out += rev[sub]; i += len; matched = true; break; }
      }
      if (matched) continue;
      out += text[i]; i += 1;
    }
    return out;
  }

  (function initKana(){
    const input = document.getElementById('kn-input');
    const output = document.getElementById('kn-output');
    const btnToRomaji = document.getElementById('kn-mode-toRomaji');
    const btnToKana = document.getElementById('kn-mode-toKana');
    const convertBtn = document.getElementById('kn-convert');
    const hint = document.getElementById('kn-hint');
    let mode = 'toRomaji';

    function setMode(m){
      mode = m;
      btnToRomaji.classList.toggle('active', m === 'toRomaji');
      btnToKana.classList.toggle('active', m === 'toKana');
      input.placeholder = m === 'toRomaji' ? 'ひらがな・カタカナの文章を入力してください…' : 'ローマ字（例: konnichiha）を入力してください…';
      hint.textContent = m === 'toRomaji'
        ? '拗音・促音・長音（ー）に対応した簡易変換です。漢字はそのまま出力されます。'
        : '促音（kka→っか）や n\' によるん区切りに対応した簡易変換です。';
    }
    btnToRomaji.addEventListener('click', () => setMode('toRomaji'));
    btnToKana.addEventListener('click', () => setMode('toKana'));
    convertBtn.addEventListener('click', () => {
      output.value = mode === 'toRomaji' ? kanaToRomaji(input.value) : romajiToKana(input.value);
    });
    document.getElementById('kn-copy').addEventListener('click', () => copyText(output.value));
    document.getElementById('kn-reset').addEventListener('click', () => { input.value = ''; output.value = ''; input.focus(); });
    setMode('toRomaji');
  })();
})();
</script>
</body>
</html>
