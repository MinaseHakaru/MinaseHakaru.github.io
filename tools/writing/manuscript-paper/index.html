<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原稿用紙エディタ | 道具帖</title>
<meta name="description" content="文章を20字×20行の原稿用紙に縦書きで流し込み、枚数の確認と印刷ができます。入力した文章は送信されません。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a class="brand-link" href="/"><span class="mark">帖</span><span class="name">道具帖</span></a>
    <nav class="tool-links">
      <a href="/tools/writing/character-count/">文字数カウント</a>
      <a href="/tools/writing/width-converter/">全角⇔半角</a>
      <a href="/tools/writing/kana-romaji/">かな⇔ローマ字</a>
      <a href="/tools/writing/manuscript-paper/" class="active">原稿用紙</a>
      <a href="/tools/writing/kanji-check/">漢字利用チェック</a>
      <a href="/tools/numbers/number-comparison/">数くらべ</a>
      <a href="/tools/numbers/real-value/">実質値</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <section class="view">
    <div class="tool-header">
      <a class="back" href="/">← 道具帖トップ</a>
      <p class="category">文章づくり道具帖</p>
      <h2>原稿用紙エディタ</h2>
      <p class="desc">入力した文章を20×20マス（400字詰め）の縦書き原稿用紙に描画します。段落の先頭は1マス字下げされます。</p>
    </div>
    <div class="panel">
      <div class="tool-body stack">
        <textarea id="gk-input" aria-label="原稿用紙に描画する文章の入力欄" style="min-height:140px;" placeholder="原稿用紙に描画したい文章を入力してください…"></textarea>
        <div class="genkou-controls">
          <button class="primary" id="gk-render">原稿用紙に描画する</button>
          <button class="ghost" id="gk-print">印刷する</button>
          <button class="ghost" id="gk-reset">リセット</button>
          <span class="sheet-pager" id="gk-pager" style="display:none;">
            <button class="ghost" id="gk-first" aria-label="先頭のページへ移動">‹‹</button>
            <button class="ghost" id="gk-prev" aria-label="前のページへ移動">‹</button>
            <input type="number" id="gk-pageInput" class="page-input" aria-label="表示するページ番号の入力欄" min="1" step="1" value="1">
            <span id="gk-pageTotal">/ 1 枚</span>
            <button class="ghost" id="gk-next" aria-label="次のページへ移動">›</button>
            <button class="ghost" id="gk-last" aria-label="最終ページへ移動">››</button>
          </span>
        </div>
        <div class="genkou-sheets" id="gk-sheets"></div>
        <div class="hint">簡易版です。句読点・閉じかっこ類は行頭に来ないよう前の行末のマスにまとめます。</div>
      </div>
    </div>
  </section>
</div>

<footer class="site-footer">
  <p>入力内容はすべてブラウザ内で処理され、外部には送信されません。</p>
  <p>水瀬衡が、文章や経済を書くときに使う小さな『ものさし』をもとにつくっています。</p>
</footer>
<div class="toast" id="toast"></div>

<script src="/assets/common.js"></script>
<script>
(function(){
  "use strict";
  const { layoutGenkou, GENKOU_PER_SHEET } = window.Toolbox;

  /* ===================== 原稿用紙エディタ ===================== */
  (function initGenkou(){
    const input = document.getElementById('gk-input');
    const renderBtn = document.getElementById('gk-render');
    const printBtn = document.getElementById('gk-print');
    const sheetsEl = document.getElementById('gk-sheets');
    const pager = document.getElementById('gk-pager');
    const pageInput = document.getElementById('gk-pageInput');
    const pageTotal = document.getElementById('gk-pageTotal');
    const firstBtn = document.getElementById('gk-first');
    const prevBtn = document.getElementById('gk-prev');
    const nextBtn = document.getElementById('gk-next');
    const lastBtn = document.getElementById('gk-last');

    // Glyph categories for correct 縦書き appearance (see CLAUDE.md).
    const GK_CORNER = new Set(['、','。','っ','ゃ','ゅ','ょ','ぁ','ぃ','ぅ','ぇ','ぉ']);
    const GK_ROTATE = new Set(['ー','—']);
    const GK_UPRIGHT = new Set(['？','！']);
    function classifyGlyph(ch){
      if (GK_CORNER.has(ch)) return 'gk-corner';
      if (GK_ROTATE.has(ch)) return 'gk-rotate';
      if (GK_UPRIGHT.has(ch)) return 'gk-upright';
      return '';
    }

    let currentPage = 0, totalSheets = 1;
    function showPage(idx){
      const sheetEls = sheetsEl.querySelectorAll('.genkou-sheet');
      sheetEls.forEach((el, i) => el.classList.toggle('active', i === idx));
      currentPage = idx;
      pageInput.value = idx + 1;
      pageTotal.textContent = `/ ${totalSheets} 枚`;
      firstBtn.disabled = idx === 0;
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === totalSheets - 1;
      lastBtn.disabled = idx === totalSheets - 1;
      // Always land on the right edge (column 1) of the newly-shown sheet,
      // even if it was scrolled left on a previous visit.
      const activeSheet = sheetEls[idx];
      const scrollEl = activeSheet && activeSheet.querySelector('.gk-scroll');
      if (scrollEl) scrollEl.scrollLeft = 0;
    }
    function commitPageInput(){
      const n = parseInt(pageInput.value, 10);
      if (Number.isInteger(n) && String(n) === pageInput.value.trim() && n >= 1 && n <= totalSheets){
        showPage(n - 1);
      } else {
        pageInput.value = currentPage + 1;
      }
    }

    function render(){
      const text = input.value;
      sheetsEl.innerHTML = '';
      if (!text){ pager.style.display = 'none'; return; }
      const sheets = layoutGenkou(text);
      totalSheets = sheets.length;
      sheets.forEach((sheet, sIdx) => {
        const wrap = document.createElement('div');
        wrap.className = 'genkou-sheet';
        const label = document.createElement('div');
        label.className = 'sheet-label';
        label.textContent = `${sIdx+1}枚目 / 全${totalSheets}枚`;
        const hint = document.createElement('div');
        hint.className = 'gk-hint';
        hint.textContent = '横にスクロールすると続きが見られます。';
        const scrollWrap = document.createElement('div');
        scrollWrap.className = 'gk-scroll';
        const grid = document.createElement('div');
        grid.className = 'gk-grid';
        for (let i = 0; i < GENKOU_PER_SHEET; i++){
          const cellData = sheet[i] || {main:null, trail:null};
          const cell = document.createElement('div');
          cell.className = 'gk-cell';
          if (cellData.main){
            const glyph = document.createElement('span');
            glyph.className = 'glyph';
            glyph.textContent = cellData.main;
            const cat = classifyGlyph(cellData.main);
            if (cat) cell.classList.add(cat);
            cell.appendChild(glyph);
          }
          if (cellData.trail){
            const trail = document.createElement('span');
            trail.className = 'trail';
            trail.textContent = cellData.trail;
            cell.appendChild(trail);
          }
          grid.appendChild(cell);
        }
        scrollWrap.appendChild(grid);
        wrap.appendChild(label);
        wrap.appendChild(hint);
        wrap.appendChild(scrollWrap);
        sheetsEl.appendChild(wrap);
      });
      pager.style.display = totalSheets > 1 ? 'inline-flex' : 'none';
      pageInput.max = totalSheets;
      showPage(0);
    }
    renderBtn.addEventListener('click', render);
    firstBtn.addEventListener('click', () => { if (currentPage > 0) showPage(0); });
    prevBtn.addEventListener('click', () => { if (currentPage > 0) showPage(currentPage - 1); });
    nextBtn.addEventListener('click', () => { if (currentPage < totalSheets - 1) showPage(currentPage + 1); });
    lastBtn.addEventListener('click', () => { if (currentPage < totalSheets - 1) showPage(totalSheets - 1); });
    pageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){ e.preventDefault(); commitPageInput(); }
    });
    pageInput.addEventListener('blur', commitPageInput);
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      if (pager.style.display === 'none') return;
      if (!document.getElementById('view-genkou').classList.contains('active')) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft' && currentPage > 0) showPage(currentPage - 1);
      else if (e.key === 'ArrowRight' && currentPage < totalSheets - 1) showPage(currentPage + 1);
    });
    printBtn.addEventListener('click', () => window.print());
    document.getElementById('gk-reset').addEventListener('click', () => {
      input.value = '';
      sheetsEl.innerHTML = '';
      pager.style.display = 'none';
      pageInput.value = '1';
      pageInput.max = 1;
      pageTotal.textContent = '/ 1 枚';
      currentPage = 0;
      totalSheets = 1;
      input.focus();
    });
  })();
})();
</script>
</body>
</html>
